name: Noon Inbox Pass

# Owner decision (Jacob, 2026-10-06): a second, inbox-only pass at about 12:05 PM Eastern.
# Chains email most promotions mid-morning, after the 7 AM refresh; this run reads only the
# deals mailbox (no web search, no source pack) and adds qualifying same-day offers to the
# morning list. Two UTC slots cover daylight-saving time; the guard runs whichever one falls
# in the 12 PM Eastern hour. No spare slot on purpose: a dropped noon event is low stakes
# (the next morning's full refresh reads the same 48-hour mail window). Costs about a fifth of a morning run, nothing when the mailbox
# has no chain email.

on:
  schedule:
    - cron: "5 16 * * *"   # 12:05 PM EDT  (11:05 AM EST -> skipped)
    - cron: "5 17 * * *"   # 12:05 PM EST  (1:05 PM EDT -> skipped)
  workflow_dispatch: {}

concurrency:
  group: noon-inbox
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether this slot is the noon hour (Eastern)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "Manual run."; exit 0; fi
          export TZ=America/New_York
          HOUR=$(date +%H)
          if [ "$HOUR" = "12" ]; then
            LAST=$(grep -o '"updatedAt": *"[^"]*"' deals.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/' || true)
            LAST_EPOCH=$(date -d "${LAST:-1970-01-01T00:00:00Z}" +%s 2>/dev/null || echo 0)
            NOON=$(date -d "$(date +%Y-%m-%d) 11:45" +%s)
            if [ "$LAST_EPOCH" -ge "$NOON" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "Skipping: a noon pass already wrote deals.json today."; else echo "run=true" >> "$GITHUB_OUTPUT"; echo "Proceeding: noon hour, $(date '+%H:%M %Z')."; fi
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Skipping: Eastern hour $HOUR is not the noon hour."
          fi

      - name: Set up Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm install --no-audit --no-fund

      - name: Inbox-only pass (no web search)
        id: pass
        if: steps.guard.outputs.run == 'true'
        timeout-minutes: 10
        continue-on-error: true
        env:
          REFRESH_MODE: inbox
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          DEALS_INBOX_USER: ${{ secrets.DEALS_INBOX_USER }}
          DEALS_INBOX_PASS: ${{ secrets.DEALS_INBOX_PASS }}
          DEALS_INBOX_HOST: ${{ secrets.DEALS_INBOX_HOST }}
          DEALS_INBOX_FOLDER: ${{ secrets.DEALS_INBOX_FOLDER }}
        run: npm run refresh

      - name: Rebuild the site if the list changed
        if: steps.guard.outputs.run == 'true'
        run: |
          if git diff --quiet -- deals.json; then echo "deals.json unchanged: no rebuild."; else npm run build; fi

      - name: Commit and push if changed
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "dailybite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached node_modules --quiet 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "chore: noon inbox pass ($(TZ=America/New_York date +'%Y-%m-%d %H:%M') ET)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (main moved). Rebasing and retrying ($i/3)..."
            git pull --rebase origin main || exit 1
          done
          exit 1

      - name: Surface a failed pass in the run status
        if: steps.guard.outputs.run == 'true' && steps.pass.outcome != 'success'
        run: echo "::warning::The noon inbox pass failed; the morning list stays as it was. Check the pass step log."
