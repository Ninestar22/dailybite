name: Daily Deal Refresh

on:
  schedule:
    # Owner decision (Jacob, 2026-08-24): refresh ONCE a day at ~7:05 AM Eastern.
    # GitHub cron is UTC-only and cannot follow daylight-saving time, so the window gets
    # several UTC slots and the guard step lets the right one do the work: a slot runs a
    # full refresh when the Eastern clock is inside the window (7-9 AM) and deals.json
    # has not been refreshed since the window opened. So the window normally runs once,
    # the later slots double as automatic retries if the first attempt fails, and
    # winter/summer both work without touching this file.
    # The :05 minute is deliberate: GitHub delays top-of-the-hour schedules the most.
    # GitHub can also DROP scheduled events entirely under load (it dropped both the
    # 11:05 and 12:05 slots on 2026-08-27), so the slots run through late morning:
    # a late refresh beats a skipped day, and the updatedAt guard still ensures the
    # refresh runs at most once per day.
    - cron: "5 11 * * *"   # 7:05 AM EDT            (6:05 EST -> skipped)
    - cron: "5 12 * * *"   # 8:05 AM EDT retry      / 7:05 AM EST
    - cron: "5 13 * * *"   # 9:05 AM EDT retry      / 8:05 AM EST retry
    - cron: "5 14 * * *"   # 10:05 AM EDT retry     / 9:05 AM EST retry
    - cron: "5 15 * * *"   # 11:05 AM EDT retry     / 10:05 AM EST retry
    - cron: "5 16 * * *"   # (12:05 EDT -> skipped) / 11:05 AM EST retry
    - cron: "35 11-16 * * *"  # :35 spares between the :05 slots: GitHub dropped THREE
                              # consecutive :05 events on 2026-08-27; each cron event is
                              # dropped independently, so density is the defense. The
                              # guard keeps the refresh to once per day regardless.
  workflow_dispatch: {}   # manual runs always do a full refresh, whatever the time
  push:
    branches: [main]
    paths: [".refresh-trigger"]  # cron-free escape hatch: commit any change to
                                 # .refresh-trigger to force a full refresh NOW.
                                 # Push events are delivered reliably, unlike cron.

# Prevent overlapping runs.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write   # needed to push the regenerated files

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether this run should proceed (7-11 AM Eastern, once per day)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: full refresh."
            exit 0
          fi
          export TZ=America/New_York
          HOUR=$(date +%H)
          TODAY=$(date +%Y-%m-%d)
          UPDATED_AT=$(grep -o '"updatedAt": *"[^"]*"' deals.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/' || true)
          UPDATED_EPOCH=$(date -d "${UPDATED_AT:-1970-01-01T00:00:00Z}" +%s 2>/dev/null || echo 0)
          echo "Eastern time: $(date '+%A %Y-%m-%d %H:%M %Z'); last refresh: ${UPDATED_AT:-unknown}"
          WINDOW_OPEN=""
          if [ "$HOUR" -ge 7 ] && [ "$HOUR" -le 11 ]; then WINDOW_OPEN=$(date -d "$TODAY 07:00" +%s); LABEL="morning (7 AM, late slots are dropped-cron insurance)"; fi
          if [ -z "$WINDOW_OPEN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: Eastern hour $HOUR is outside the window (this slot serves the other half of the year)."
          elif [ "$UPDATED_EPOCH" -ge "$WINDOW_OPEN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: deals were already refreshed in the $LABEL window."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding: $LABEL window and no refresh since it opened."
          fi

      - name: Set up Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm install --no-audit --no-fund

      - name: Snapshot previous deals for new-badge diff
        if: steps.guard.outputs.run == 'true'
        run: cp deals.json deals-prev.json

      - name: Regenerate deals.json (fails closed on bad data)
        id: refresh
        if: steps.guard.outputs.run == 'true'
        # A hung API request must not stall the whole run (the 2026-08-27 push-triggered
        # run sat in this step 30+ minutes): kill it and let the build reuse the last
        # good deals.json; the later cron slots retry the refresh automatically.
        timeout-minutes: 20
        # continue-on-error: a failed refresh keeps the last known-good deals.json,
        # but the build below STILL runs so date-gated logic (expiry drops, weekday
        # specials, footer date) stays current. Fixes the 2026-08-17 site freeze.
        # A failed scheduled refresh is retried automatically by the window's later slots.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}   # optional repo variable; falls back to script default
        run: npm run refresh

      - name: Rebuild the site from deals.json
        if: steps.guard.outputs.run == 'true'
        run: npm run build

      - name: Generate today's social post image
        if: steps.guard.outputs.run == 'true'
        # Runs before the commit step so social/*.png ride the daily commit and are
        # served by Pages (Instagram fetches the image from the live site).
        continue-on-error: true
        run: npm run social:image

      - name: Commit and push if changed
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "dailybite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached node_modules --quiet 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DAY=$(TZ=America/New_York date +%Y-%m-%d)
            HHMM=$(TZ=America/New_York date +%H:%M)
            if [ "${{ steps.refresh.outcome }}" != "success" ]; then
              MSG="chore: rebuild - refresh failed, kept last good deals ($DAY $HHMM ET)"
            else
              MSG="chore: deal refresh ($DAY $HHMM ET)"
            fi
            git commit -m "$MSG"
            # main can move while this run works (a web-UI commit landed mid-run and the
            # plain push was rejected in run #89, 2026-08-23): rebase and retry.
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push rejected (main moved). Rebasing and retrying ($i/3)..."
              git pull --rebase origin main || exit 1
            done
            echo "Could not push after 3 attempts."
            exit 1
          fi

      - name: Post today's deals to Pinterest and Instagram
        # Only after a SUCCESSFUL refresh (never re-post yesterday's list) and after the
        # push above, so the image is live for Instagram to fetch. Each platform is
        # skipped by the script until its secrets are configured (see SOCIAL.md).
        if: steps.guard.outputs.run == 'true' && steps.refresh.outcome == 'success'
        continue-on-error: true
        env:
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
        run: npm run social:post

      - name: Surface refresh failure in run status
        if: steps.guard.outputs.run == 'true' && steps.refresh.outcome != 'success'
        run: |
          echo "::warning::Deal refresh failed in this run - site was rebuilt from the last good deals.json. The window's later slots will retry automatically. Check the refresh step log."
