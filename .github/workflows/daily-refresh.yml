name: Daily Deal Refresh

on:
  schedule:
    # 11:00 UTC daily (~6-7am US Eastern). GitHub may delay scheduled runs
    # by several minutes under load — this is expected.
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Prevent overlapping runs.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write   # needed to push the regenerated files

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Snapshot yesterday's deals for new-badge diff
        run: cp deals.json deals-prev.json

      - name: Regenerate deals.json (fails closed on bad data)
        id: refresh
        # continue-on-error: a failed refresh keeps yesterday's known-good deals.json,
        # but the build below STILL runs so date-gated logic (expiry drops, weekday
        # specials, footer date) stays current. Fixes the 2026-08-17 site freeze.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}   # optional repo variable; falls back to script default
        run: npm run refresh

      - name: Rebuild index.html from deals.json
        run: npm run build

      - name: Commit and push if changed
        run: |
          git config user.name "dailybite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached node_modules --quiet 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "No deal changes today."
          else
            MSG="chore: daily deal refresh ($(date -u +%Y-%m-%d))"
            if [ "${{ steps.refresh.outcome }}" != "success" ]; then
              MSG="chore: daily rebuild - refresh failed, kept last good deals ($(date -u +%Y-%m-%d))"
            fi
            git commit -m "$MSG"
            git push
          fi

      - name: Surface refresh failure in run status
        if: steps.refresh.outcome != 'success'
        run: |
          echo "::warning::Deal refresh failed today - site was rebuilt from the last good deals.json. Check the refresh step log."
