name: Daily Deal Refresh

on:
  schedule:
    # Owner request (Jacob, 2026-08-22): refresh at about 7 AM Eastern every morning.
    # GitHub cron is UTC-only and cannot follow daylight-saving time, so FOUR slots are
    # scheduled and the guard step below lets exactly the right one do the work:
    #   10:40 UTC = 6:40 AM EDT (Mar-Nov)    11:40 UTC = 6:40 AM EST (Nov-Mar) / 7:40 AM EDT
    #   12:40 UTC and 13:40 UTC = same-morning RETRIES, used only if the first refresh failed.
    # The guard runs the job only while deals.json has NOT been refreshed today and the
    # Eastern clock reads 6 to 9 AM, so a normal day gets one run (~6:40 AM ET, finishing
    # well before 7) and a bad day gets up to three more tries before 10 AM. The :40 minute
    # is deliberate: GitHub delays top-of-the-hour schedules the most.
    - cron: "40 10 * * *"
    - cron: "40 11 * * *"
    - cron: "40 12 * * *"
    - cron: "40 13 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab (always runs)

# Prevent overlapping runs.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write   # needed to push the regenerated files

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether this run should proceed (6-9 AM Eastern and not yet refreshed today)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: proceeding."
            exit 0
          fi
          HOUR=$(TZ=America/New_York date +%H)
          TODAY=$(TZ=America/New_York date +%Y-%m-%d)
          UPDATED=$(grep -o '"updated": *"[0-9-]*"' deals.json | head -1 | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' || true)
          echo "Eastern time: $(TZ=America/New_York date '+%A %Y-%m-%d %H:%M %Z'); deals.json updated: ${UPDATED:-unknown}"
          if [ "$UPDATED" = "$TODAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: deals were already refreshed today."
          elif [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 9 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding: morning window and no refresh yet today."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: outside the 6-9 AM Eastern window (this slot serves the other half of the year)."
          fi

      - name: Set up Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm install --no-audit --no-fund

      - name: Snapshot yesterday's deals for new-badge diff
        if: steps.guard.outputs.run == 'true'
        run: cp deals.json deals-prev.json

      - name: Regenerate deals.json (fails closed on bad data)
        id: refresh
        if: steps.guard.outputs.run == 'true'
        # continue-on-error: a failed refresh keeps yesterday's known-good deals.json,
        # but the build below STILL runs so date-gated logic (expiry drops, weekday
        # specials, footer date) stays current. Fixes the 2026-08-17 site freeze.
        # A failed scheduled refresh is retried automatically by the later cron slots.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}   # optional repo variable; falls back to script default
        run: npm run refresh

      - name: Rebuild index.html from deals.json
        if: steps.guard.outputs.run == 'true'
        run: npm run build

      - name: Commit and push if changed
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "dailybite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached node_modules --quiet 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "No deal changes today."
          else
            MSG="chore: daily deal refresh ($(TZ=America/New_York date +%Y-%m-%d))"
            if [ "${{ steps.refresh.outcome }}" != "success" ]; then
              MSG="chore: daily rebuild - refresh failed, kept last good deals ($(TZ=America/New_York date +%Y-%m-%d))"
            fi
            git commit -m "$MSG"
            git push
          fi

      - name: Surface refresh failure in run status
        if: steps.guard.outputs.run == 'true' && steps.refresh.outcome != 'success'
        run: |
          echo "::warning::Deal refresh failed in this run - site was rebuilt from the last good deals.json. A later morning slot will retry automatically (until 9 AM Eastern). Check the refresh step log."
