name: Inbox check

# Manual, free check that the deals mailbox secrets work inside GitHub Actions (2026-10-05).
# Runs only scripts/inbox-pack.mjs: no Anthropic call, nothing written, nothing committed.
# Actions -> Inbox check -> Run workflow. The log line "Inbox pack: read N, kept M" is the
# answer; "AUTHENTICATIONFAILED" means the DEALS_INBOX_* secrets are wrong.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Read the deals mailbox
        env:
          DEALS_INBOX_USER: ${{ secrets.DEALS_INBOX_USER }}
          DEALS_INBOX_PASS: ${{ secrets.DEALS_INBOX_PASS }}
          DEALS_INBOX_HOST: ${{ secrets.DEALS_INBOX_HOST }}
          DEALS_INBOX_FOLDER: ${{ secrets.DEALS_INBOX_FOLDER }}
        run: node scripts/inbox-pack.mjs
